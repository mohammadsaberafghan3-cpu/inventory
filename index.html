<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172a"><meta name="description" content="سامانه آفلاین مدیریت انبار، خرید، فروش و حسابداری">
<link rel="manifest" href="./manifest.json"><title>سامانه مدیریت انبار و فروش</title>
<style>
:root{--bg:#0d1425;--panel:#151f35;--panel2:#1b2943;--line:#293955;--text:#edf2ff;--muted:#9eacc5;--accent:#5038ed;--green:#25bd8b;--red:#e45b70;--gold:#e8b84e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#101a30;border-bottom:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:17px;font-weight:bold}.status{font-size:12px;color:#62dfb4;border:1px solid #1d705d;border-radius:20px;padding:6px 10px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}aside{padding:14px;background:#0a1120;border-left:1px solid var(--line)}nav{display:grid;gap:7px}nav button{background:transparent;border:0;color:var(--muted);padding:12px;text-align:right;border-radius:10px}nav button.active,nav button:hover{background:var(--accent);color:white}main{padding:22px;max-width:1400px;width:100%;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.pagehead h1{font-size:21px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.metric{font-size:24px;font-weight:bold;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#782d40}.btn.good{background:#167c61}input,select,textarea{width:100%;background:#0d172a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}label{display:grid;gap:6px;color:var(--muted);font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#1b2943;color:#cbd7ef;font-size:12px}tr:last-child td{border:0}.pill{padding:4px 8px;border-radius:20px;background:#263653;font-size:11px}.pill.ok{background:#145541;color:#a7f4d9}.pill.warn{background:#60491d;color:#ffe2a0}.empty{padding:28px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(760px,94vw);max-height:90vh;padding:18px}dialog::backdrop{background:#000a}.dialoghead{display:flex;justify-content:space-between;align-items:center}.lineitems{display:grid;gap:8px}.line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:7px;align-items:end}.notice{background:#2c2618;color:#ffdf9a;border:1px solid #69552c;border-radius:10px;padding:12px;margin-bottom:15px;font-size:12px}.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:sticky;top:57px;z-index:4;padding:7px;overflow:auto;border-left:0;border-bottom:1px solid var(--line)}nav{display:flex;min-width:max-content}nav button{padding:9px 12px}main{padding:14px}.line{grid-template-columns:1fr 1fr}.line>*:first-child{grid-column:1/-1}.top{padding:11px}.brand{font-size:14px}}
</style></head><body>
<header class="top"><div class="brand">▦ سامانه مدیریت انبار، خرید و فروش</div><div class="status" id="net">حالت محلی</div></header>
<div class="layout"><aside><nav id="nav">
<button data-page="home" class="active">▦ داشبورد</button><button data-page="products">▣ کالاها و بارکدها</button><button data-page="warehouses">▤ انبارها و موجودی</button><button data-page="partners">♙ طرف‌حساب‌ها</button><button data-page="purchase">🛒 فاکتورهای خرید</button><button data-page="sales">▧ فاکتورهای فروش</button><button data-page="payments">▤ دریافت و پرداخت</button><button data-page="reports">▥ گزارش‌ها</button><button data-page="backup">⟲ پشتیبان‌گیری</button>
</nav></aside><main id="app"></main></div>
<dialog id="dlg"><div class="dialoghead"><h3 id="dlgTitle"></h3><button class="btn secondary" onclick="closeDlg()">بستن</button></div><div id="dlgBody"></div></dialog>
<script>
const KEY='inventory_web_v1';
const blank=()=>({products:[],warehouses:[{id:'w1',name:'انبار اصلی',code:'WH-01'}],partners:[],invoices:[],payments:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch{db=blank()}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=n=>Number(n||0).toLocaleString('fa-IR');
const money=n=>fmt(Math.round(Number(n)||0))+' ریال';
const el=s=>document.querySelector(s);
let page='home';
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
el('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function head(title,action=''){return '<div class="pagehead"><h1>'+title+'</h1><div class="actions">'+action+'</div></div>'}
function btn(label,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
function openDlg(title,html){el('#dlgTitle').textContent=title;el('#dlgBody').innerHTML=html;el('#dlg').showModal()}
function closeDlg(){el('#dlg').close()}
function field(label,name,value='',type='text',extra=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+String(value??'').replaceAll('"','&quot;')+'" '+extra+'></label>'}
function opts(items,selected){return items.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+x.name+'</option>').join('')}
function total(inv){return inv.items.reduce((s,x)=>s+x.qty*x.price-x.discount+Math.round((x.qty*x.price-x.discount)*x.tax/100),0)}
function bal(partnerId){let n=0;db.invoices.filter(i=>i.partnerId===partnerId&&i.status==='confirmed').forEach(i=>n+=(i.type==='sale'?1:-1)*total(i));db.payments.filter(p=>p.partnerId===partnerId).forEach(p=>n+=(p.kind==='receipt'?-1:1)*p.amount);return n}
function stock(productId,warehouseId){let n=0;db.invoices.filter(i=>i.status==='confirmed'&&(!warehouseId||i.warehouseId===warehouseId)).forEach(i=>i.items.forEach(x=>{if(x.productId===productId)n+=(i.type==='purchase'?1:-1)*x.qty}));return n}
function render(){const a=el('#app');if(page==='home')a.innerHTML=home();else if(page==='products')a.innerHTML=products();else if(page==='warehouses')a.innerHTML=warehouses();else if(page==='partners')a.innerHTML=partners();else if(page==='purchase'||page==='sales')a.innerHTML=invoices(page==='purchase'?'purchase':'sale');else if(page==='payments')a.innerHTML=payments();else if(page==='reports')a.innerHTML=reports();else if(page==='backup')a.innerHTML=backup()}
function home(){const sales=db.invoices.filter(i=>i.type==='sale'&&i.status==='confirmed').reduce((s,i)=>s+total(i),0),purch=db.invoices.filter(i=>i.type==='purchase'&&i.status==='confirmed').reduce((s,i)=>s+total(i),0);return head('داشبورد اصلی')+'<div class="notice">اطلاعات این نسخه در حافظه مرورگر همین دستگاه ذخیره می‌شود. پاک‌کردن داده‌های مرورگر ممکن است اطلاعات را حذف کند؛ مرتب نسخه پشتیبان بگیرید.</div><div class="grid">'+[['تعداد کالا',db.products.length],['طرف‌حساب‌ها',db.partners.length],['انبارها',db.warehouses.length],['فاکتورهای باز',db.invoices.filter(i=>i.status==='draft').length],['مجموع فروش تاییدشده',money(sales)],['مجموع خرید تاییدشده',money(purch)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="card" style="margin-top:14px"><b>شروع سریع</b><div class="actions" style="margin-top:12px">'+btn('افزودن کالا',"productForm()") +btn('طرف‌حساب جدید',"partnerForm()",'secondary')+btn('فاکتور خرید جدید',"invoiceForm('purchase')",'secondary')+btn('فاکتور فروش جدید',"invoiceForm('sale')",'secondary')+'</div></div>'}
function products(){return head('کالاها و بارکدها',btn('+ کالای جدید','productForm()'))+(db.products.length?'<div class="tablewrap"><table><thead><tr><th>کد</th><th>نام کالا</th><th>بارکد</th><th>واحد</th><th>قیمت خرید</th><th>قیمت فروش</th><th>موجودی کل</th><th>عملیات</th></tr></thead><tbody>'+db.products.map(p=>'<tr><td>'+p.code+'</td><td>'+p.name+'</td><td>'+p.barcode+'</td><td>'+p.unit+'</td><td>'+money(p.buy)+'</td><td>'+money(p.sell)+'</td><td>'+fmt(stock(p.id))+'</td><td>'+btn('ویرایش',"productForm('"+p.id+"')",'secondary')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">هنوز کالایی ثبت نشده است.</div>')}
function productForm(pid){const p=db.products.find(x=>x.id===pid)||{};openDlg(pid?'ویرایش کالا':'ثبت کالای جدید','<form id="f">'+field('کد کالا','code',p.code)+field('نام کالا','name',p.name)+field('بارکد','barcode',p.barcode)+field('واحد','unit',p.unit||'عدد')+'<div class="formgrid">'+field('قیمت خرید (ریال)','buy',p.buy||0,'number')+field('قیمت فروش (ریال)','sell',p.sell||0,'number')+field('حداقل موجودی','min',p.min||0,'number')+'</div><div class="actions">'+btn('ذخیره',"saveProduct('"+(pid||'')+"')")+'</div></form>')}
function saveProduct(pid){const f=new FormData(el('#f'));const p={id:pid||id(),code:f.get('code').trim(),name:f.get('name').trim(),barcode:f.get('barcode').trim(),unit:f.get('unit').trim()||'عدد',buy:+f.get('buy'),sell:+f.get('sell'),min:+f.get('min')};if(!p.name)return alert('نام کالا الزامی است');if(db.products.some(x=>x.id!==pid&&p.code&&x.code===p.code))return alert('کد کالا تکراری است');if(pid)db.products[db.products.findIndex(x=>x.id===pid)]=p;else db.products.push(p);closeDlg();save()}
function warehouses(){return head('انبارها و موجودی',btn('+ انبار جدید','warehouseForm()'))+'<div class="grid">'+db.warehouses.map(w=>'<div class="card"><b>'+w.name+'</b><p class="muted">'+w.code+'</p>'+btn('مشاهده موجودی',"warehouseStock('"+w.id+"')",'secondary')+'</div>').join('')+'</div>'}
function warehouseForm(){openDlg('افزودن انبار','<form id="f">'+field('کد انبار','code')+field('نام انبار','name')+'<div class="actions">'+btn('ذخیره',"saveWarehouse()")+'</div></form>')}
function saveWarehouse(){const f=new FormData(el('#f'));if(!f.get('name').trim())return alert('نام انبار الزامی است');db.warehouses.push({id:id(),code:f.get('code'),name:f.get('name')});closeDlg();save()}
function warehouseStock(wid){const w=db.warehouses.find(x=>x.id===wid);openDlg('موجودی '+w.name,'<div class="tablewrap"><table><tr><th>کالا</th><th>موجودی</th></tr>'+db.products.map(p=>'<tr><td>'+p.name+'</td><td>'+fmt(stock(p.id,wid))+'</td></tr>').join('')+'</table></div>')}
function partners(){return head('طرف‌حساب‌ها',btn('+ طرف‌حساب جدید','partnerForm()'))+(db.partners.length?'<div class="tablewrap"><table><tr><th>کد</th><th>نام</th><th>نوع</th><th>تلفن</th><th>مانده حساب</th><th>عملیات</th></tr>'+db.partners.map(p=>'<tr><td>'+p.code+'</td><td>'+p.name+'</td><td>'+p.kind+'</td><td>'+p.phone+'</td><td>'+money(bal(p.id))+'</td><td>'+btn('ویرایش',"partnerForm('"+p.id+"')",'secondary')+'</td></tr>').join('')+'</table></div>':'<div class="card empty">طرف‌حسابی ثبت نشده است.</div>')}
function partnerForm(pid){const p=db.partners.find(x=>x.id===pid)||{};openDlg(pid?'ویرایش طرف‌حساب':'طرف‌حساب جدید','<form id="f">'+field('کد','code',p.code)+field('نام','name',p.name)+field('تلفن','phone',p.phone)+'<label>نوع طرف‌حساب<select name="kind"><option '+(p.kind==='مشتری'?'selected':'')+'>مشتری</option><option '+(p.kind==='تامین‌کننده'?'selected':'')+'>تامین‌کننده</option><option '+(p.kind==='هر دو'?'selected':'')+'>هر دو</option></select></label><div class="actions">'+btn('ذخیره',"savePartner('"+(pid||'')+"')")+'</div></form>')}
function savePartner(pid){const f=new FormData(el('#f'));if(!f.get('name').trim())return alert('نام الزامی است');const p={id:pid||id(),code:f.get('code'),name:f.get('name'),phone:f.get('phone'),kind:f.get('kind')};if(pid)db.partners[db.partners.findIndex(x=>x.id===pid)]=p;else db.partners.push(p);closeDlg();save()}
function invoices(type){const list=db.invoices.filter(i=>i.type===type);return head(type==='purchase'?'فاکتورهای خرید':'فاکتورهای فروش',btn('+ فاکتور جدید', "invoiceForm('"+type+"')"))+(list.length?'<div class="tablewrap"><table><tr><th>شماره</th><th>تاریخ</th><th>طرف‌حساب</th><th>انبار</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr>'+list.map(i=>'<tr><td>'+i.number+'</td><td>'+i.date+'</td><td>'+((db.partners.find(p=>p.id===i.partnerId)||{}).name||'—')+'</td><td>'+((db.warehouses.find(w=>w.id===i.warehouseId)||{}).name||'—')+'</td><td>'+money(total(i))+'</td><td><span class="pill '+(i.status==='confirmed'?'ok':'warn')+'">'+(i.status==='confirmed'?'تایید شده':'پیش‌نویس')+'</span></td><td>'+btn(i.status==='draft'?'ویرایش':'مشاهده',"invoiceForm('"+type+"','"+i.id+"')",'secondary')+'</td></tr>').join('')+'</table></div>':'<div class="card empty">فاکتوری ثبت نشده است.</div>')}
function invoiceForm(type,invId){const inv=db.invoices.find(x=>x.id===invId);if(inv&&inv.status!=='draft'){return openDlg('فاکتور تاییدشده','<p>این سند پس از تایید قابل ویرایش نیست.</p><p>مبلغ: '+money(total(inv))+'</p>')}
const x=inv||{items:[]};let rows=x.items.map(lineHtml).join('');openDlg(type==='sale'?'فاکتور فروش':'فاکتور خرید','<form id="f">'+field('شماره فاکتور','number',x.number||('INV-'+(db.invoices.length+1).toString().padStart(4,'0')))+field('تاریخ','date',x.date||new Date().toISOString().slice(0,10),'date')+'<div class="formgrid"><label>طرف‌حساب<select name="partnerId" required>'+opts(db.partners,x.partnerId)+'</select></label><label>انبار<select name="warehouseId">'+opts(db.warehouses,x.warehouseId||db.warehouses[0]?.id)+'</select></label></div><div id="lines" class="lineitems">'+rows+'</div><div class="actions" style="margin:12px 0">'+btn('+ افزودن ردیف',"addLine()",'secondary')+'</div><div id="sum" class="card">جمع فاکتور: '+money(x.items.length?total(x):0)+'</div><div class="actions" style="margin-top:12px">'+btn('ذخیره پیش‌نویس',"saveInvoice('"+type+"','"+(invId||'')+"')")+(!invId? '': '')+'</div></form>');window.currentInvoiceType=type;window.currentInvoiceId=invId||'';updateSum()}
function lineHtml(x={}){return '<div class="line"><label>کالا<select class="prod"><option value="">انتخاب کالا</option>'+opts(db.products,x.productId)+'</select></label><label>تعداد<input class="qty" type="number" min=".000001" step=".000001" value="'+(x.qty||1)+'"></label><label>قیمت واحد<input class="price" type="number" min="0" value="'+(x.price||0)+'"></label><label>تخفیف<input class="discount" type="number" min="0" value="'+(x.discount||0)+'"></label><button type="button" class="btn danger" onclick="this.parentElement.remove();updateSum()">×</button></div>'}
function addLine(){el('#lines').insertAdjacentHTML('beforeend',lineHtml());updateSum()}
function readLines(){return [...document.querySelectorAll('#lines .line')].map(r=>({productId:r.querySelector('.prod').value,qty:+r.querySelector('.qty').value,price:+r.querySelector('.price').value,discount:+r.querySelector('.discount').value,tax:0})).filter(x=>x.productId&&x.qty>0&&x.price>=0)}
function updateSum(){const rows=readLines();el('#sum').textContent='جمع فاکتور: '+money(rows.reduce((s,x)=>s+x.qty*x.price-x.discount,0))}
document.addEventListener('input',e=>{if(e.target.closest('#lines'))updateSum()});
function saveInvoice(type,invId){const f=new FormData(el('#f')),items=readLines();if(!f.get('partnerId'))return alert('ابتدا طرف‌حساب تعریف کنید');if(!items.length)return alert('حداقل یک ردیف کالای معتبر لازم است');const inv={id:invId||id(),type,number:f.get('number'),date:f.get('date'),partnerId:f.get('partnerId'),warehouseId:f.get('warehouseId'),items,status:'draft'};if(invId)db.invoices[db.invoices.findIndex(i=>i.id===invId)]=inv;else db.invoices.push(inv);closeDlg();save();if(confirm('پیش‌نویس ذخیره شد. آیا فاکتور را همین حالا تایید می‌کنید؟'))confirmInvoice(inv.id)}
function confirmInvoice(iid){const i=db.invoices.find(x=>x.id===iid);if(!i||i.status!=='draft')return;if(i.type==='sale'){for(const line of i.items){if(stock(line.productId,i.warehouseId)<line.qty)return alert('موجودی کافی نیست: '+db.products.find(p=>p.id===line.productId).name)}}if(!confirm('پس از تایید، فاکتور قفل می‌شود و موجودی تغییر می‌کند. ادامه؟'))return;i.status='confirmed';save()}
function payments(){return head('دریافت و پرداخت',btn('+ ثبت تراکنش','paymentForm()'))+(db.payments.length?'<div class="tablewrap"><table><tr><th>تاریخ</th><th>طرف‌حساب</th><th>نوع</th><th>مبلغ</th><th>روش</th><th>توضیح</th></tr>'+db.payments.map(p=>'<tr><td>'+p.date+'</td><td>'+((db.partners.find(x=>x.id===p.partnerId)||{}).name||'')+'</td><td>'+p.kind+'</td><td>'+money(p.amount)+'</td><td>'+p.method+'</td><td>'+p.note+'</td></tr>').join('')+'</table></div>':'<div class="card empty">تراکنشی ثبت نشده است.</div>')}
function paymentForm(){openDlg('ثبت دریافت یا پرداخت','<form id="f"><label>طرف‌حساب<select name="partnerId">'+opts(db.partners)+'</select></label><div class="formgrid"><label>نوع<select name="kind"><option value="receipt">دریافت از مشتری</option><option value="payment">پرداخت به تامین‌کننده</option></select></label>'+field('مبلغ (ریال)','amount','','number')+field('تاریخ','date',new Date().toISOString().slice(0,10),'date')+'</div><label>روش<select name="method"><option>نقدی</option><option>کارت‌خوان</option><option>حواله بانکی</option><option>چک</option></select></label>'+field('توضیحات','note')+'<div class="actions" style="margin-top:12px">'+btn('ذخیره',"savePayment()")+'</div></form>')}
function savePayment(){const f=new FormData(el('#f'));if(!f.get('partnerId')||+f.get('amount')<=0)return alert('طرف‌حساب و مبلغ معتبر لازم است');db.payments.push({id:id(),partnerId:f.get('partnerId'),kind:f.get('kind'),amount:+f.get('amount'),date:f.get('date'),method:f.get('method'),note:f.get('note')});closeDlg();save()}
function reports(){const sales=db.invoices.filter(i=>i.type==='sale'&&i.status==='confirmed'),purchases=db.invoices.filter(i=>i.type==='purchase'&&i.status==='confirmed');return head('گزارش‌ها')+'<div class="grid"><div class="card"><div class="muted">فروش تاییدشده</div><div class="metric">'+money(sales.reduce((s,i)=>s+total(i),0))+'</div></div><div class="card"><div class="muted">خرید تاییدشده</div><div class="metric">'+money(purchases.reduce((s,i)=>s+total(i),0))+'</div></div></div><div class="card" style="margin-top:14px"><b>مانده طرف‌حساب‌ها</b><div class="tablewrap"><table><tr><th>نام</th><th>نوع</th><th>مانده (ریال)</th></tr>'+db.partners.map(p=>'<tr><td>'+p.name+'</td><td>'+p.kind+'</td><td>'+money(bal(p.id))+'</td></tr>').join('')+'</table></div></div>'}
function backup(){return head('پشتیبان‌گیری و بازیابی')+'<div class="card"><p>از همه کالاها، طرف‌حساب‌ها، فاکتورها و تراکنش‌ها یک نسخه JSON دریافت کنید.</p><div class="actions">'+btn('دانلود نسخه پشتیبان','exportBackup()')+'<label class="btn secondary">بازیابی از فایل<input type="file" accept="application/json" onchange="importBackup(event)" style="display:none"></label></div></div><div class="notice" style="margin-top:14px">نسخه پشتیبان را در جای امن نگه دارید. داده‌های این نسخه به‌صورت خودکار به دستگاه دیگری منتقل نمی‌شوند.</div>'}
function exportBackup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='inventory-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.data||!Array.isArray(x.data.products)||!Array.isArray(x.data.invoices))throw Error();if(!confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟'))return;db=x.data;save();alert('بازیابی انجام شد')}catch{alert('فایل پشتیبان معتبر نیست')}};r.readAsText(file)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
